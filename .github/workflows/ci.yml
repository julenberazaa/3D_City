name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke + gameplay (fixture world, no network needed)
        run: npx playwright test smoke drive --project=chromium
      - name: Provenance & traceability audit
        run: |
          test -f docs/agent/PROVENANCE.md
          test -f docs/agent/DATA_SOURCES.md
          test -f docs/agent/UPSTREAM_REUSE_AUDIT.md
          test -f docs/agent/TRACEABILITY.md
          npm audit --omit=dev --audit-level=high
      - name: Placeholder diff audit
        run: |
          if grep -rnE "TODO|FIXME" src --include="*.ts" | grep -v "^\s*\*"; then
            echo "unjustified TODO/FIXME in src"; exit 1
          fi

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
